
name: Build VAMOS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Prepare VAMOS
        run: |
          unzip -q VAMOS_Phone_Build_Package.zip -d VAMOS_Android_Offline
          cd VAMOS_Android_Offline
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: VAMOS_Android_Offline/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VAMOS-APK
          path: VAMOS_Android_Offline/android/app/build/outputs/apk/debug/app-debug.apk
